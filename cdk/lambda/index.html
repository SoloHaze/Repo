<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Delia ❤️</title>
    <style>
        /* --- ESTILOS GENERALES Y BACKGROUND --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* --- CONFIGURACIÓN DE IMAGEN DE BACKGROUND --- */
            /* 1. Descomenta la línea de abajo y pon la URL de tu imagen */
            background-image: url('https://miproyectostack-bucketimagenes217a321f-wwlwwnm1hnr4.s3.us-east-1.amazonaws.com/3.jpg');
            
            /* 2. Mientras tanto, usamos un degradado romántico */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* El fondo se queda quieto al hacer scroll */
        }

        /* Contenedor principal para dar opacidad y separar del fondo */
        .main-container {
            background-color: rgba(255, 255, 255, 0.85); /* Fondo blanco semi-transparente */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-top: 50px;
            margin-bottom: 50px;
            text-align: center;
            width: 90%;
            max-width: 800px;
        }

        /* --- ESTILOS DE TEXTO --- */
        .titulo-principal {
            font-size: 4rem; /* ¡Bien grande! */
            color: #e74c3c; /* Color Rojo romántico */
            margin-bottom: 10px;
            font-weight: 800;
            /* Efecto de texto redondeado y suave */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            letter-spacing: -1px;
        }

        .subtitulo {
            font-size: 1.8rem;
            color: #27ae60; /* Color Verde esperanza */
            margin-top: 0;
            font-weight: 400;
            font-style: italic;
        }

        /* --- ESTILOS DEL CARRUSEL --- */
        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 800px; /* Aumentamos el ancho para que luzcan más */
            height: 500px;    /* Aumentamos la altura */
            margin: 40px auto;
            overflow: hidden;
            border-radius: 15px;
            background-color: #000; /* Fondo negro para que si la foto es alta, los lados no se vean vacíos */
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: 5px solid white;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            /* CAMBIO CLAVE: 'contain' muestra la imagen completa sin cortes */
            object-fit: contain; 
            flex-shrink: 0;
        }
        .carousel-slide {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }


        /* Botones del carrusel */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.7);
            color: #333;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 1.2rem;
            z-index: 10;
            transition: background-color 0.3s;
        }

        .carousel-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }

        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        /* Responsive para móviles */
        @media (max-width: 600px) {
            .titulo-principal { font-size: 2.5rem; }
            .subtitulo { font-size: 1.3rem; }
            .carousel-container { height: 250px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1 class="titulo-principal">Te amo Delia❤️</h1>
        <h2 class="subtitulo">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</h2>
        <p class="subtitulo">Gracias por llegar a mi vida</p>

            <div class="carousel-container">
                <div class="carousel-slide">
                    <img src="https://miproyectostack-bucketimagenes217a321f-wwlwwnm1hnr4.s3.us-east-1.amazonaws.com/1.jpg" alt="Foto 1">
                    
                    <img src="https://miproyectostack-bucketimagenes217a321f-wwlwwnm1hnr4.s3.us-east-1.amazonaws.com/2.jpg" alt="Foto 2">
                    
                    <img src="https://miproyectostack-bucketimagenes217a321f-wwlwwnm1hnr4.s3.us-east-1.amazonaws.com/3.jpg" alt="Foto 3">
                    
                    <img src="https://miproyectostack-bucketimagenes217a321f-wwlwwnm1hnr4.s3.us-east-1.amazonaws.com/4.jpg" alt="Foto 4">
                    
                    <img src="https://miproyectostack-bucketimagenes217a321f-wwlwwnm1hnr4.s3.us-east-1.amazonaws.com/5.jpg" alt="Foto 5">
                    
                    <img src="https://miproyectostack-bucketimagenes217a321f-wwlwwnm1hnr4.s3.us-east-1.amazonaws.com/6.jpg" alt="Foto 6">
                </div>
                
                <button class="carousel-btn prev-btn" onclick="moveSlide(-1)">&#10094;</button>
                <button class="carousel-btn next-btn" onclick="moveSlide(1)">&#10095;</button>
            </div>
    </div>

    <script>
        let currentSlide = 0;
        const slide = document.querySelector('.carousel-slide');
        const images = document.querySelectorAll('.carousel-slide img');
        const totalImages = images.length;

        function moveSlide(direction) {
            currentSlide = (currentSlide + direction + totalImages) % totalImages;
            const offset = -currentSlide * 100;
            slide.style.transform = `translateX(${offset}%)`;
        }

        // Opcional: Carrusel automático cada 5 segundos
        // setInterval(() => moveSlide(1), 5000);
    </script>

</body>
</html>
